# ==========================================
# 基本設定
# ==========================================

# Ctrl+Bをプレフィックスとして使用（デフォルト）
set -g prefix C-b

# マウス操作を有効化
set -g mouse on

# スクロール履歴を3000行に
set -g history-limit 3000

# ウィンドウ・ペイン番号を1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウ削除後に番号を詰める
set -g renumber-windows on

# 色表示（互換性重視）
set -g default-terminal "screen-256color"

# VimのEscキーの反応改善
set -sg escape-time 10


# ==========================================
# ペイン操作（Vim風）
# ==========================================

# Ctrl+B → h/j/k/l でペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ctrl+B → | で左右分割
bind | split-window -h

# Ctrl+B → - で上下分割
bind - split-window -v

# Ctrl+B → z で最大化（標準機能）


# ==========================================
# コピー・スクロール
# ==========================================

# コピーモードをVim操作に
setw -g mode-keys vi

# vで選択開始、yでコピー
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# ==========================================
# ステータスバー
# ==========================================

# ステータスバーを下部に表示
set -g status-position bottom

# 2秒ごとに更新
set -g status-interval 2

# アクティブウィンドウを強調
setw -g window-status-current-style "fg=black,bg=green,bold"


# ==========================================
# 設定の再読み込み
# ==========================================

# Ctrl+B → r で設定反映
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# 通常のペイン境界（グレー）
set -g pane-border-style "fg=colour245"

# 操作中のペイン境界（水色）
set -g pane-active-border-style "fg=colour51"

# Tera Term向け：ASCII文字で境界線を描画
set -gw pane-border-lines simple

# Ctrl + 矢印キーでペイン移動
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# Right-click menu: keep default entries and add New Window.
bind-key -T root MouseDown3Pane       if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" "select-pane -t= ; send -M" "display-menu -t= -xM -yM -T \"#[align=centre]#{pane_index} (#{pane_id})\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}\" < \"send -X history-top\" \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}\" > \"send -X history-bottom\" '' \"#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}\" C-r \"if -F \\\"#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}\\\" \\\"copy-mode -t=\\\" ; send -Xt= search-backward \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}\" C-y \"copy-mode -q ; send-keys -l -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}\" c \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_word}\\\"\" \"#{?mouse_line,Copy Line,}\" l \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_line}\\\"\" '' \"New Window\" w new-window \"Horizontal Split\" h \"split-window -h\" \"Vertical Split\" v \"split-window -v\" '' \"#{?#{>:#{window_panes},1},,-}Swap Up\" u \"swap-pane -U\" \"#{?#{>:#{window_panes},1},,-}Swap Down\" d \"swap-pane -D\" \"#{?pane_marked_set,,-}Swap Marked\" s swap-pane '' Kill X kill-pane Respawn R \"respawn-pane -k\" \"#{?pane_marked,Unmark,Mark}\" m \"select-pane -m\" \"#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}\" z \"resize-pane -Z\""
bind-key -T root M-MouseDown3Pane     display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < "send -X history-top" "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > "send -X history-bottom" '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r "if -F \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}\" \"copy-mode -t=\" ; send -Xt= search-backward \"#{q:mouse_word}\"" "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y "copy-mode -q ; send-keys -l -- \"#{q:mouse_word}\"" "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c "copy-mode -q ; set-buffer -- \"#{q:mouse_word}\"" "#{?mouse_line,Copy Line,}" l "copy-mode -q ; set-buffer -- \"#{q:mouse_line}\"" '' "New Window" w new-window "Horizontal Split" h "split-window -h" "Vertical Split" v "split-window -v" '' "#{?#{>:#{window_panes},1},,-}Swap Up" u "swap-pane -U" "#{?#{>:#{window_panes},1},,-}Swap Down" d "swap-pane -D" "#{?pane_marked_set,,-}Swap Marked" s swap-pane '' Kill X kill-pane Respawn R "respawn-pane -k" "#{?pane_marked,Unmark,Mark}" m "select-pane -m" "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z "resize-pane -Z"

# Switch windows without prefix.
bind -n C-Home previous-window
bind -n C-End next-window

# Ctrl+1..9: select window by number (Tera Term custom sequences).
set -s user-keys[0] "\e[9001~"
bind -n User0 select-window -t :1
set -s user-keys[1] "\e[9002~"
bind -n User1 select-window -t :2
set -s user-keys[2] "\e[9003~"
bind -n User2 select-window -t :3
set -s user-keys[3] "\e[9004~"
bind -n User3 select-window -t :4
set -s user-keys[4] "\e[9005~"
bind -n User4 select-window -t :5
set -s user-keys[5] "\e[9006~"
bind -n User5 select-window -t :6
set -s user-keys[6] "\e[9007~"
bind -n User6 select-window -t :7
set -s user-keys[7] "\e[9008~"
bind -n User7 select-window -t :8
set -s user-keys[8] "\e[9009~"
bind -n User8 select-window -t :9
